    <!-- CRM Chat Widget (Business ID: 44c86918-f6e2-46d8-bf68-df397f438dab) -->
    <script>
      (function() {
        // Intercept any third-party bootstrap network errors from gyanvaniai widget
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
          var stack = (reason && reason.stack) || '';
          if (msg.indexOf('CRM Chat') !== -1 || stack.indexOf('gyanvaniai') !== -1 || stack.indexOf('widget') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        });

        function loadScript() {
          if (window.__chatWidgetInitialized) return;
          window.__chatWidgetInitialized = true;

          try {
            if (!document.querySelector('link[href*="api.gyanvaniai.online/styles.css"]')) {
              var link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = 'https://api.gyanvaniai.online/styles.css';
              document.head.appendChild(link);
            }

            var script = document.createElement('script');
            script.src = "https://api.gyanvaniai.online/chat-widget.js";
            script.setAttribute('data-business-id', "44c86918-f6e2-46d8-bf68-df397f438dab");
            script.async = true;
            script.onerror = function() {
              console.warn('CRM Chat Widget: Service temporarily unreachable.');
            };
            document.body.appendChild(script);
          } catch (e) {
            console.warn('CRM Chat Widget initialization prevented:', e);
          }
        }

        function initChatWidget() {
          try {
            var consentData = localStorage.getItem('hk_portfolio_cookie_consent') || localStorage.getItem('gyanvaniai_cookie_consent');
            if (consentData) {
              var parsed = JSON.parse(consentData);
              if (parsed && (parsed.status === 'all' || (parsed.preferences && (parsed.preferences.functional || parsed.preferences.analytics || parsed.preferences.marketing)))) {
                loadScript();
                return;
              }
            }
          } catch (e) {}

          // Auto-mount after small delay so widget is visible to visitors
          setTimeout(loadScript, 1000);
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          initChatWidget();
        } else {
          window.addEventListener('DOMContentLoaded', initChatWidget);
          window.addEventListener('load', initChatWidget);
        }

        window.addEventListener('cookie-consent-updated', initChatWidget);
        window.addEventListener('click', function(e) {
          if (e.target && (e.target.closest('#crm-chat-widget') || e.target.closest('.chat-button') || e.target.closest('[data-chat-trigger]'))) {
            loadScript();
          }
        }, { passive: true });
      })();
    </script>
